[build-dependencies]
bindgen = "0.72.1"
cbindgen = "0.29.0"

[dependencies]
binrw = "0.15.1"
chrono = "0.4.44"
crossbeam = "0.8.4"
ctrlc = "3.5.2"
libc = "1.0.0-alpha.3"
lockfree-object-pool = "0.1.6"
num = "0.4.3"
rand = "0.10.0"
rand_distr = "0.6.0"
rayon = "1.11.0"
rustfft = "6.4.1"
serde_yaml = "0.9.34+deprecated"
tokio = { version = "1.51.1", features = ["full"] }
tokio-stream = "0.1"
async-stream = "0.3"
futures-util = {version="0.3.31", features=["alloc"]}
futures-core = "0.3.31"
if-addrs = "0.15.0"
pnet_datalink = "0.35.0"


[dependencies.clap]
features = ["derive"]
version = "4.6.0"

[dependencies.serde]
features = ["derive"]
version = "1.0.228"

[lib]
crate-type = [
    "staticlib",
    "rlib",
]
name = "syncdaq"

[package]
edition = "2024"
name = "syncdaq"
version = "0.1.0"

[profile.release]
opt-level = 3
