[build-dependencies]
bindgen = "0.72.1"
cbindgen = "0.29.0"

[dependencies]
async-stream = "0.3.6"
binrw = "0.15.2"
chrono = "0.4.45"
core_affinity = "0.8.3"
crossbeam = "0.8.4"
ctrlc = "3.5.2"
futures-core = "0.3.33"
if-addrs = "0.15.0"
itertools = "0.15.0"
libc = "1.0.0-alpha.4"
lockfree-object-pool = "0.1.6"
num = "0.4.3"
pnet_datalink = "0.35.0"
rand = "0.10.2"
rand_distr = "0.6.0"
rayon = "1.12.0"
rustfft = "6.4.1"
serde_yaml = "0.9.34"
tokio-stream = "0.1.19"

[dependencies.clap]
features = ["derive"]
version = "4.6.5"

[dependencies.futures-util]
features = ["alloc"]
version = "0.3.33"

[dependencies.serde]
features = ["derive"]
version = "1.0.229"

[dependencies.tokio]
features = ["full"]
version = "1.53.1"

[lib]
crate-type = [
    "staticlib",
    "rlib",
]
name = "syncdaq"

[package]
edition = "2024"
name = "syncdaq"
version = "0.1.0"

[profile.release]
opt-level = 3
